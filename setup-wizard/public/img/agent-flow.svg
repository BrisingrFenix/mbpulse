<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #d9e2de; stroke-width: 1.5; }
    .accent { fill: #eaf4f0; stroke: #078966; }
    .t  { fill: #1c2b27; font-size: 13px; font-weight: 600; }
    .s  { fill: #5f7269; font-size: 11px; }
    .g  { fill: #056b50; font-size: 11px; font-weight: 600; }
    .arrow { stroke: #078966; stroke-width: 2; fill: none; marker-end: url(#q); }
  </style>
  <defs>
    <marker id="q" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#078966"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="34" width="160" height="72" rx="12"/>
  <text class="t" x="96" y="64" text-anchor="middle">Your answers</text>
  <text class="s" x="96" y="82" text-anchor="middle">sensor · screens · study</text>

  <path class="arrow" d="M178,70 H216"/>

  <rect class="box" x="220" y="34" width="160" height="72" rx="12"/>
  <text class="t" x="300" y="64" text-anchor="middle">AGENT_BRIEF.md</text>
  <text class="s" x="300" y="82" text-anchor="middle">spec + generated config</text>
  <text class="s" x="300" y="96" text-anchor="middle">+ done-checklist</text>

  <path class="arrow" d="M382,70 H420"/>

  <rect class="box" x="424" y="34" width="160" height="72" rx="12"/>
  <text class="t" x="504" y="64" text-anchor="middle">Your AI agent</text>
  <text class="s" x="504" y="82" text-anchor="middle">fills the template's</text>
  <text class="s" x="504" y="96" text-anchor="middle">TODO(agent) stubs</text>

  <path class="arrow" d="M586,70 H624"/>

  <rect class="box accent" x="628" y="34" width="116" height="72" rx="12"/>
  <text class="t" x="686" y="64" text-anchor="middle">Your app</text>
  <text class="s" x="686" y="82" text-anchor="middle">runs on simulated</text>
  <text class="s" x="686" y="96" text-anchor="middle">data on day one</text>

  <text class="g" x="380" y="140" text-anchor="middle">You verify against the checklist — every item is visible on screen, no code reading needed.</text>
</svg>
