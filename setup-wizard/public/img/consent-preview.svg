<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .t  { fill: #1c2b27; font-size: 13px; font-weight: 600; }
    .s  { fill: #5f7269; font-size: 11.5px; }
    .lab { fill: #056b50; font-size: 12px; font-weight: 600; }
    .tiny { fill: #5f7269; font-size: 10px; }
    .ph-label { fill: #078966; font-size: 8.5px; font-weight: 700; letter-spacing: .4px; }
    .ph-text { fill: #1c2b27; font-size: 10px; }
    .line { stroke: #078966; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>

  <text class="t" x="20" y="26">Each data type becomes one consent page — participants accept or decline them individually:</text>

  <!-- phone -->
  <rect x="290" y="44" width="190" height="276" rx="18" fill="#ffffff" stroke="#1c2b27" stroke-width="2.5"/>
  <rect x="352" y="52" width="66" height="5" rx="2.5" fill="#d9e2de"/>

  <text class="ph-text" x="306" y="84" font-weight="700" font-size="12">Heart Rate and HRV</text>

  <text class="ph-label" x="306" y="106">WHAT WE COLLECT</text>
  <text class="ph-text" x="306" y="119">Heart rate derived from the</text>
  <text class="ph-text" x="306" y="131">wearable's PPG sensor.</text>

  <text class="ph-label" x="306" y="153">WHY WE COLLECT IT</text>
  <text class="ph-text" x="306" y="166">Monitor cardiovascular</text>
  <text class="ph-text" x="306" y="178">activity during sleep.</text>

  <text class="ph-label" x="306" y="200">RETENTION PERIOD</text>
  <text class="ph-text" x="306" y="213">Deleted 56 days after the</text>
  <text class="ph-text" x="306" y="225">study ends, or on withdrawal.</text>

  <text class="ph-label" x="306" y="247">HOW OFTEN IT IS RECORDED</text>
  <text class="ph-text" x="306" y="260">At most one reading every 30 s.</text>

  <rect x="306" y="276" width="76" height="24" rx="12" fill="none" stroke="#b3261e" stroke-width="1.5"/>
  <text x="344" y="292" text-anchor="middle" fill="#b3261e" font-size="10.5" font-weight="600">Decline</text>
  <rect x="390" y="276" width="76" height="24" rx="12" fill="#078966"/>
  <text x="428" y="292" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Accept</text>

  <!-- left callouts -->
  <text class="lab" x="20" y="84" text-anchor="start">“Participant-facing name”</text>
  <path class="line" d="M170,80 H302"/>
  <text class="lab" x="20" y="115">“What is collected”</text>
  <path class="line" d="M170,111 H302"/>
  <text class="lab" x="20" y="162">“Why it is collected”</text>
  <path class="line" d="M170,158 H302"/>

  <!-- right callouts -->
  <text class="lab" x="500" y="209">“Retention (days)”</text>
  <path class="line" d="M470,205 H496"/>
  <text class="lab" x="500" y="256">“Sampling (seconds)”</text>
  <path class="line" d="M470,252 H496"/>
  <text class="lab" x="500" y="288">“Essential” types can't be</text>
  <text class="lab" x="500" y="303">declined without leaving</text>
  <path class="line" d="M470,290 H496"/>

  <text class="tiny" x="20" y="322">The measurement schemas you tick don't appear here — they wire the app's processing to this consent choice.</text>
</svg>
