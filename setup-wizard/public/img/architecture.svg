<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #d9e2de; stroke-width: 1.5; rx: 12; }
    .accent { fill: #eaf4f0; stroke: #078966; }
    .t  { fill: #1c2b27; font-size: 14px; font-weight: 600; }
    .s  { fill: #5f7269; font-size: 11.5px; }
    .g  { fill: #078966; font-size: 11.5px; font-weight: 600; }
    .arrow { stroke: #078966; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#078966"/>
    </marker>
  </defs>

  <!-- phone -->
  <rect class="box accent" x="20" y="30" width="200" height="120" rx="12"/>
  <rect x="95" y="42" width="50" height="86" rx="8" fill="none" stroke="#078966" stroke-width="2"/>
  <rect x="112" y="118" width="16" height="3" rx="1.5" fill="#078966"/>
  <text class="t" x="120" y="170" text-anchor="middle">Participant's phone</text>
  <text class="s" x="120" y="188" text-anchor="middle">encrypts everything on-device;</text>
  <text class="s" x="120" y="202" text-anchor="middle">keys live in its hardware chip</text>

  <!-- supabase -->
  <rect class="box" x="280" y="30" width="200" height="120" rx="12"/>
  <ellipse cx="380" cy="62" rx="34" ry="12" fill="none" stroke="#5f7269" stroke-width="2"/>
  <path d="M346,62 v40 a34,12 0 0 0 68,0 v-40" fill="none" stroke="#5f7269" stroke-width="2"/>
  <text class="t" x="380" y="170" text-anchor="middle">Supabase backend</text>
  <text class="s" x="380" y="188" text-anchor="middle">stores ciphertext only —</text>
  <text class="s" x="380" y="202" text-anchor="middle">it can never read the data</text>

  <!-- PI -->
  <rect class="box accent" x="540" y="30" width="200" height="120" rx="12"/>
  <rect x="605" y="52" width="70" height="46" rx="4" fill="none" stroke="#078966" stroke-width="2"/>
  <path d="M628,98 h24 l6,12 h-36 z" fill="none" stroke="#078966" stroke-width="2"/>
  <text class="t" x="640" y="170" text-anchor="middle">Your computer (PI)</text>
  <text class="s" x="640" y="188" text-anchor="middle">decrypts exports locally —</text>
  <text class="s" x="640" y="202" text-anchor="middle">private key never leaves it</text>

  <!-- arrows -->
  <path class="arrow" d="M222,80 H276"/>
  <text class="g" x="249" y="70" text-anchor="middle">sync</text>
  <path class="arrow" d="M482,80 H536"/>
  <text class="g" x="509" y="70" text-anchor="middle">export</text>
</svg>
