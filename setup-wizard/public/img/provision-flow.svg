<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, 'Segoe UI', sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #d9e2de; stroke-width: 1.5; }
    .accent { fill: #eaf4f0; stroke: #078966; }
    .t  { fill: #1c2b27; font-size: 13px; font-weight: 600; }
    .s  { fill: #5f7269; font-size: 11.5px; }
    .g  { fill: #056b50; font-size: 11.5px; font-weight: 600; }
    .mono { fill: #1c2b27; font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
    .arrow { stroke: #078966; stroke-width: 2; fill: none; marker-end: url(#p); }
  </style>
  <defs>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#078966"/>
    </marker>
  </defs>

  <!-- a) SQL files -> database -->
  <text class="t" x="20" y="28">a) Database setup</text>
  <g>
    <rect class="box" x="20" y="42" width="150" height="20" rx="5"/><text class="mono" x="30" y="56">00_schema.sql</text>
    <rect class="box" x="26" y="68" width="150" height="20" rx="5"/><text class="mono" x="36" y="82">rls_policies.sql</text>
    <rect class="box" x="32" y="94" width="150" height="20" rx="5"/><text class="mono" x="42" y="108">join_code.sql</text>
    <rect class="box" x="38" y="120" width="150" height="20" rx="5"/><text class="mono" x="48" y="134">withdraw.sql</text>
    <rect class="box" x="44" y="146" width="150" height="20" rx="5"/><text class="mono" x="54" y="160">seed_study.sql</text>
  </g>
  <path class="arrow" d="M200,104 H262"/>
  <text class="g" x="231" y="94" text-anchor="middle">run in order</text>
  <rect class="accent box" x="268" y="66" width="170" height="76" rx="12"/>
  <text class="t" x="353" y="96" text-anchor="middle">Your backend</text>
  <text class="s" x="353" y="114" text-anchor="middle">tables · security policies</text>
  <text class="s" x="353" y="128" text-anchor="middle">· functions</text>
  <text class="s" x="120" y="188">safe to re-run — nothing is duplicated</text>

  <!-- b) keys -->
  <text class="t" x="480" y="28">b) The two keypairs</text>
  <rect class="box" x="480" y="42" width="260" height="86" rx="10"/>
  <text class="t" x="492" y="63">PI key <tspan class="s" font-weight="400">(reads study data)</tspan></text>
  <text class="s" x="492" y="83">• private → stays on this machine,</text>
  <text class="s" x="500" y="97">back it up offline</text>
  <text class="s" x="492" y="115">• public → goes into your study (step 3)</text>

  <rect class="box" x="480" y="140" width="260" height="86" rx="10"/>
  <text class="t" x="492" y="161">Receipt key <tspan class="s" font-weight="400">(signs deletion proofs)</tspan></text>
  <text class="s" x="492" y="181">• secret half → Supabase, via the</text>
  <text class="s" x="500" y="195">commands in box d</text>
  <text class="s" x="492" y="213">• public half → goes into the app (step 4)</text>
</svg>
