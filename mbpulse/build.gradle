// pt.ua.mbpulse:mbpulse:<version>
//   .\gradlew.bat :mbpulse:publishToMavenLocal                       (release, from committed code)
//   .\gradlew.bat :mbpulse:publishToMavenLocal "-Pmbpulse.snapshot"  (<version>-SNAPSHOT, any state)
// sample-app in this repository keeps using project(":mbpulse").

/** Output of `git <args>` run in this module's folder ("" when git fails). */
def gitOutput = { List<String> args ->
    providers.exec {
        commandLine(["git"] + args)
        workingDir = projectDir
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId    = "pt.ua.mbpulse"
            artifactId = "mbpulse"
            version    = project.version
            afterEvaluate { from components.release }
            pom {
                name        = "mbPulse library"
                description = "End-to-end-encrypted clinical data collection for Android: consent, encryption, storage, sync and UI."
                // The commit this artifact was built from (with "-dirty" for a
                // snapshot of uncommitted changes) — what "1.0.0" actually is.
                properties.put("gitCommit", gitOutput(["rev-parse", "HEAD"]).map { commit ->
                    def dirty = !gitOutput(["status", "--porcelain", "--", "."]).get().isEmpty()
                    commit + (dirty ? "-dirty" : "")
                })
            }
        }
    }
}

// A release version must be reproducible: built from committed library code,
// and never re-published from a different commit (study apps that pinned it
// would silently get other code). Snapshots skip both checks.
tasks.withType(PublishToMavenLocal).configureEach {
    doFirst {
        if (project.version.toString().endsWith("-SNAPSHOT")) return
        def head = gitOutput(["rev-parse", "HEAD"]).get()
        if (head.isEmpty()) {
            throw new GradleException("Publishing release ${project.version} needs git (to record the commit) — " +
                "or publish a snapshot: \"-Pmbpulse.snapshot\"")
        }
        if (!gitOutput(["status", "--porcelain", "--", "."]).get().isEmpty()) {
            throw new GradleException("mbpulse/ has uncommitted changes, so it cannot be published as release " +
                "${project.version} (that version must always mean the same code). Commit them first, or publish a " +
                "snapshot for testing: \"-Pmbpulse.snapshot\" (→ ${project.version}-SNAPSHOT).")
        }
        def m2 = System.getProperty("maven.repo.local") ?: "${System.getProperty("user.home")}/.m2/repository"
        def pom = new File(m2, "pt/ua/mbpulse/mbpulse/${project.version}/mbpulse-${project.version}.pom")
        def published = pom.exists() ? (pom.text =~ /<gitCommit>([^<]+)<\/gitCommit>/) : null
        if (published && published[0][1] != head) {
            throw new GradleException("Release ${project.version} is already published from commit ${published[0][1]}; " +
                "this is ${head}. Raise releaseVersion in mbpulse/build.gradle for a new release.")
        }
    }
}

